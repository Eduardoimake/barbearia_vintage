# Blueprint do Render - Barbearia Vintage & Co.
# Recursos: 1 PostgreSQL + 1 Web Service (Django) + 1 Static Site (Vite).
# Nenhum segredo fica neste arquivo: valores marcados com "sync: false" sao
# solicitados no painel do Render ao criar o Blueprint.

databases:
  - name: barbearia-db
    databaseName: barbearia
    user: barbearia
    plan: free            # Free expira em 30 dias. Para producao use "basic-256mb" ou superior.
    region: virginia
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- BACKEND
  - type: web
    name: barbearia-api
    runtime: python
    region: virginia
    plan: free            # Free "dorme" apos inatividade. Para producao use "starter" ou superior.
    rootDir: barbearia_backend
    buildCommand: bash build.sh
    startCommand: gunicorn barbearia_backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: USE_PROXY_SSL_HEADER
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: WEB_CONCURRENCY
        value: "2"
      # URLs HTTPS reais (preencher no painel; ver README_DEPLOY_RENDER.md)
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      # Armazenamento externo (S3 compativel: Cloudflare R2, AWS S3, Backblaze B2...)
      - key: MEDIA_STORAGE
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

  # --------------------------------------------------------------- FRONTEND
  - type: web
    name: barbearia-frontend
    runtime: static
    rootDir: barbearia_frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      # Lida durante o build do Vite. Alterar exige novo deploy do Static Site.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin